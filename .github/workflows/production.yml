name: Deploy production to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production
      url: https://orchhapalace.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_TARGET: cloudflare
      PUBLIC_SITE_URL: https://orchhapalace.com
      PUBLIC_SITE_STATUS: production
      PUBLIC_MEDIA_PREVIEW: "false"
      PUBLIC_BOOKING_URL: "https://bookingengine.maximojo.com/?hid=India54468d49-cd5b-4af2-a615-303eda366eea"
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm test
          npm run check
          git diff --check

      - name: Build production site
        run: npm run build

      - name: Verify production artifact
        run: npm run verify:production

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env="" --strict
