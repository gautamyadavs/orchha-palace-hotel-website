name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and upload Pages artifact
        uses: withastro/action@v3
        with:
          node-version: 22.12.0
        env:
          PUBLIC_SITE_STATUS: staging
          PUBLIC_MEDIA_PREVIEW: "true"
          PUBLIC_BOOKING_URL: "https://bookingengine.maximojo.com/?hid=India54468d49-cd5b-4af2-a615-303eda366eea"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
